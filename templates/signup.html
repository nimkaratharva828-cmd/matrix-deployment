<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Matrix Signup</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #0f0f0f;
        --secondary-color: #181818;
        --card-bg: #202020;
        --border-color: #2b2b2b;
        --hover-bg: #2a2a2a;
        --text-primary: #ffffff;
        --text-secondary: #aaaaaa;
        --accent-color: #ff0000;
        --transition: all 0.3s ease;
      }

      body {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: radial-gradient(circle at top left, #1b1b1b, #0f0f0f 60%);
        font-family: "Inter", sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* BACKGROUND EFFECTS */

      body::before {
        content: "";
        position: absolute;
        width: 520px;
        height: 520px;
        background: rgba(255, 0, 0, 0.08);
        border-radius: 50%;
        top: -220px;
        right: -150px;
        filter: blur(120px);
      }

      body::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 50%;
        bottom: -180px;
        left: -100px;
        filter: blur(100px);
      }

      /* CARD */

      .form-container {
        width: 100%;
        max-width: 440px;
        background: rgba(24, 24, 24, 0.96);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border-color);
        border-radius: 26px;
        padding: 42px 34px;
        position: relative;
        z-index: 2;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      }

      /* LOGO */

      .logo {
        text-align: center;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 1px;
        color: white;
        margin-bottom: 10px;
      }

      .logo span {
        color: var(--accent-color);
      }

      .subtitle {
        text-align: center;
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 34px;
      }

      /* INPUT GROUP */

      .input-group {
        position: relative;
        margin-bottom: 18px;
      }

      .input-group i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        font-size: 14px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        height: 54px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 0 18px 0 46px;
        color: white;
        font-size: 14px;
        outline: none;
        transition: var(--transition);
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.08);
      }

      input::placeholder {
        color: var(--text-secondary);
      }

      /* BUTTON */

      button {
        width: 100%;
        height: 54px;
        border: none;
        border-radius: 14px;
        background: var(--accent-color);
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 8px;
      }

      button:hover {
        background: #d90000;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 0, 0, 0.25);
      }

      /* FOOTER TEXT */

      .bottom-text {
        margin-top: 22px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .bottom-text a {
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 600;
        transition: var(--transition);
      }

      .bottom-text a:hover {
        opacity: 0.8;
      }

      /* MESSAGES */

      .messages {
        list-style: none;
        margin-bottom: 20px;
      }

      .messages li {
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 13px;
        margin-bottom: 10px;
        font-weight: 500;
        border: 1px solid transparent;
      }

      .messages li.success {
        background: rgba(0, 255, 120, 0.08);
        border-color: rgba(0, 255, 120, 0.15);
        color: #70ffae;
      }

      .messages li.error {
        background: rgba(255, 0, 0, 0.08);
        border-color: rgba(255, 0, 0, 0.15);
        color: #ff8d8d;
      }

      .messages li {
        background: rgba(255, 0, 0, 0.08);
        border-color: rgba(255, 0, 0, 0.15);
        color: #ff8d8d;
      }

      /* RESPONSIVE */

      @media (max-width: 500px) {
        .form-container {
          padding: 34px 24px;
          border-radius: 22px;
        }

        .logo {
          font-size: 28px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
          height: 50px;
        }

        button {
          height: 50px;
        }
      }

      /* SCROLLBAR */

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <div class="logo">MAT<span>RIX</span></div>

      <p class="subtitle">Create your account and start streaming</p>

      <!-- DISPLAY MESSAGES -->

      {% if messages %}
      <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %}

      <!-- SIGNUP FORM -->

      <form method="post">
        {% csrf_token %}

        <div class="input-group">
          <i class="fa-solid fa-user"></i>

          <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
          />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>

          <input type="email" name="email" placeholder="Enter Email" required />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            name="password"
            placeholder="Create Password"
            required
          />
        </div>

        <button type="submit">
          <i class="fa-solid fa-user-plus"></i>
          Create Account
        </button>

        <div class="bottom-text">
          Already have an account?
          <a href="{% url 'login' %}">Login</a>
        </div>
      </form>
    </div>
  </body>
</html>
