<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/static/img/dot_matrix.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Profile - Matrix</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #0f0f0f;
        --secondary-color: #212121;
        --accent-color: #ff0000;
        --text-primary: #ffffff;
        --text-secondary: #a8a8a8;
        --border-color: #272727;
        --hover-bg: #272727;
        --card-bg: #1a1a1a;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .main-container {
        display: flex;
        flex: 1;
      }

      /* ========== HEADER ========== */
      .header {
        background: var(--primary-color);
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(10px);
        background: rgba(15, 15, 15, 0.95);
      }

      .topnav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        gap: 30px;
        height: 65px;
      }

      .menu {
        display: none;
        font-size: 24px;
        cursor: pointer;
        transition: var(--transition);
        padding: 10px;
        border-radius: 8px;
      }

      .menu:hover {
        background: var(--hover-bg);
      }

      .menu.active {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ========== SEARCH BAR ========== */
      .search {
        display: flex;
        align-items: center;
        background: var(--secondary-color);
        border: 1px solid var(--border-color);
        border-radius: 25px;
        padding: 8px 15px;
        gap: 12px;
        flex: 0 1 400px;
        position: relative;
        transition: var(--transition);
      }

      .search:focus-within {
        background: var(--secondary-color);
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
      }

      .seainp {
        background: transparent;
        border: none;
        color: var(--text-primary);
        flex: 1;
        padding: 8px 0;
        font-size: 14px;
        outline: none;
      }

      .seainp::placeholder {
        color: var(--text-secondary);
      }

      .seabtt {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: var(--transition);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .seabtt:hover {
        background: #cc0000;
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(255, 0, 0, 0.3);
      }

      /* ========== SUGGESTIONS DROPDOWN ========== */
      .suggestion-list {
        list-style: none;
        padding: 8px 0;
        margin: 0;
        border: 1px solid var(--border-color);
        position: absolute;
        background: var(--secondary-color);
        z-index: 1001;
        top: 100%;
        left: 0;
        right: 0;
        margin-top: 8px;
        border-radius: 12px;
        max-height: 400px;
        overflow-y: auto;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }

      .suggestion-list li {
        padding: 12px 16px;
        cursor: pointer;
        font-size: 13px;
        transition: var(--transition);
        border-left: 3px solid transparent;
      }

      .suggestion-list li:hover {
        background-color: var(--hover-bg);
        border-left-color: var(--accent-color);
        padding-left: 16px;
      }

      /* ========== LOGIN BUTTON ========== */
      .cy {
        display: flex;
        align-items: center;
      }

      .cy ul {
        list-style-type: none;
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .cy a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: var(--secondary-color);
        border-radius: 50%;
        transition: var(--transition);
        font-size: 18px;
        color: var(--accent-color);
        border: 1px solid var(--border-color);
      }

      .cy a:hover {
        background: var(--accent-color);
        color: white;
        transform: scale(1.1);
      }

      /* ========== SIDEBAR ========== */
      .sidenav {
        display: flex;
        flex-direction: column;
        width: 260px;
        background: var(--secondary-color);
        border-right: 1px solid var(--border-color);
        padding: 20px 0;
        overflow-y: auto;
        height: auto;
      }

      .sidenav .icon {
        flex: 1;
        padding: 0 10px;
      }

      .sidenav .icon ul {
        list-style-type: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sidenav .icon a {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 12px 16px;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 8px;
        transition: var(--transition);
        font-size: 14px;
        font-weight: 500;
      }

      .sidenav .icon a:hover {
        background: var(--hover-bg);
        color: var(--text-primary);
        padding-left: 20px;
      }

      .sidenav .icon a i {
        font-size: 18px;
        width: 24px;
      }

      .sidenav .sett {
        padding: 20px 10px;
        border-top: 1px solid var(--border-color);
        margin-top: auto;
      }

      .sidenav .sett ul {
        list-style-type: none;
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .sidenav .sett a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: var(--hover-bg);
        border-radius: 8px;
        color: var(--text-secondary);
        text-decoration: none;
        transition: var(--transition);
        font-size: 16px;
      }

      .sidenav .sett a:hover {
        background: var(--accent-color);
        color: white;
        transform: scale(1.1);
      }

      /* ========== MOBILE SIDEBAR OVERLAY ========== */
      .sidenav.mobile-visible {
        position: fixed;
        left: 0;
        top: 65px;
        width: 240px;
        height: calc(100vh - 65px);
        z-index: 999;
        animation: slideInLeft 0.3s ease-out;
      }

      @keyframes slideInLeft {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }

      /* ========== PROFILE PAGE ========== */
      .profile-container {
        flex: 1;
        padding: 40px;
        width: 100%;
        overflow-y: auto;
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 30px;
        margin-bottom: 50px;
        padding-bottom: 30px;
        border-bottom: 1px solid var(--border-color);
      }

      .profile-avatar {
        flex-shrink: 0;
      }

      .profile-avatar img {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 3px solid var(--accent-color);
        object-fit: cover;
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        transition: var(--transition);
      }

      .profile-avatar img:hover {
        transform: scale(1.05);
        box-shadow: 0 0 40px rgba(255, 0, 0, 0.3);
      }

      .profile-info h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          var(--accent-color) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .profile-info p {
        font-size: 15px;
        color: var(--text-secondary);
        margin-bottom: 12px;
      }

      .profile-stats {
        display: flex;
        gap: 30px;
        margin-top: 20px;
      }

      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .stat-number {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent-color);
      }

      .stat-label {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* ========== PROFILE FORM ========== */
      .profile-form {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 40px;
        max-width: 800px;
        animation: fadeIn 0.6s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-section {
        margin-bottom: 40px;
      }

      .form-section:last-child {
        margin-bottom: 0;
      }

      .form-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 20px;
        color: var(--text-primary);
        padding-bottom: 10px;
        border-bottom: 2px solid var(--border-color);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 25px;
      }

      .form-row.full {
        grid-template-columns: 1fr;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        background: var(--secondary-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 16px;
        color: var(--text-primary);
        font-size: 14px;
        font-family: "Inter", sans-serif;
        transition: var(--transition);
        outline: none;
      }

      .form-group input::placeholder,
      .form-group textarea::placeholder {
        color: var(--text-secondary);
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        border-color: var(--accent-color);
        background: var(--secondary-color);
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
      }

      .form-group input[readonly] {
        background: rgba(0, 0, 0, 0.2);
        cursor: not-allowed;
      }

      /* ========== BUTTONS ========== */
      .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid var(--border-color);
      }

      .btn {
        flex: 1;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-save {
        background: linear-gradient(
          135deg,
          var(--accent-color) 0%,
          #ff3333 100%
        );
        color: white;
      }

      .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(255, 0, 0, 0.3);
      }

      .btn-save:active {
        transform: translateY(0);
      }

      .btn-cancel {
        background: var(--secondary-color);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }

      .btn-cancel:hover {
        background: var(--hover-bg);
        border-color: var(--accent-color);
      }

      /* ========== RESPONSIVE ========== */
      @media (max-width: 768px) {
        .topnav {
          padding: 12px 12px;
          gap: 12px;
        }

        .menu {
          display: flex !important;
          align-items: center;
          justify-content: center;
        }

        .search {
          flex: 1;
          min-width: 0;
        }

        .sidenav {
          display: none;
        }

        .sidenav.mobile-visible {
          display: flex;
        }

        .profile-container {
          padding: 20px;
        }

        .profile-header {
          flex-direction: column;
          text-align: center;
          gap: 20px;
        }

        .profile-avatar img {
          width: 100px;
          height: 100px;
        }

        .profile-info h1 {
          font-size: 24px;
        }

        .profile-stats {
          justify-content: center;
          gap: 20px;
        }

        .profile-form {
          padding: 25px;
        }

        .form-row {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .form-actions {
          flex-direction: column;
          gap: 10px;
        }

        .btn {
          padding: 10px 16px;
          font-size: 13px;
        }
      }

      @media (max-width: 480px) {
        .profile-container {
          padding: 15px;
        }

        .profile-form {
          padding: 20px;
        }

        .form-title {
          font-size: 16px;
        }

        .profile-info h1 {
          font-size: 20px;
        }

        .form-row {
          margin-bottom: 20px;
        }

        .profile-stats {
          gap: 15px;
        }

        .stat-number {
          font-size: 20px;
        }
      }

      /* ========== SCROLLBAR ========== */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }

      /* ========== SUCCESS MESSAGE ========== */
      .success-message {
        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
        color: #000;
        padding: 16px 24px;
        border-radius: 8px;
        font-weight: 600;
        z-index: 10000;
        animation: slideInRight 0.3s ease-out;
        box-shadow: 0 8px 16px rgba(0, 255, 0, 0.3);
      }

      @keyframes slideInRight {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .success-message.hide {
        animation: slideOutRight 0.3s ease-out forwards;
      }

      @keyframes slideOutRight {
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header class="header">
        <div class="topnav">
          <div class="menu" id="menuToggle">
            <i class="fa-solid fa-bars" style="color: #ffffff"></i>
          </div>
          <form method="get" action="">
            <div class="search">
              <i
                class="fa-solid fa-magnifying-glass"
                style="color: var(--text-secondary); font-size: 14px"
              ></i>
              <input
                class="seainp"
                id="searchBar"
                name="search"
                type="search"
                placeholder="Search videos..."
              />
              <ul id="suggestions" class="suggestion-list"></ul>
              <button class="seabtt" type="submit">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </form>
          <div class="cy">
            <ul>
              <li>
                <a href="{% url 'login' %}" title="Sign In">
                  <i class="fa-solid fa-user"></i>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </header>

      <div class="main-container">
        <aside class="sidenav" id="sidenav">
          <div class="icon">
            <ul>
              <li>
                <a href="/">
                  <i class="fa-solid fa-house"></i>
                  <span>Home</span>
                </a>
              </li>
              <li>
                <a href="/profile">
                  <i class="fa-solid fa-user-circle"></i>
                  <span>Profile</span>
                </a>
              </li>
              <li>
                <a href="/upload">
                  <i class="fa-solid fa-cloud-arrow-up"></i>
                  <span>Upload</span>
                </a>
              </li>
              <li>
                <a href="/contactus">
                  <i class="fa-solid fa-comments"></i>
                  <span>Chat-Bot</span>
                </a>
              </li>
              <li>
                <a href="/news">
                  <i class="fa-solid fa-newspaper"></i>
                  <span>News</span>
                </a>
              </li>
            </ul>
          </div>
          <div class="sett">
            <ul>
              <li>
                <a href="/info" title="Info">
                  <i class="fa-solid fa-circle-info"></i>
                </a>
              </li>
              <li>
                <a href="/setting" title="Settings">
                  <i class="fa-solid fa-gear"></i>
                </a>
              </li>
            </ul>
          </div>
        </aside>

        <div class="profile-container">
          <!-- Profile Header -->
          <div class="profile-header">
            <div class="profile-avatar">
              <img
                src="/static/img/user-png-icon-16.jpg"
                alt="Profile Avatar"
              />
            </div>
            <div class="profile-info">
              <h1>Atharva Santosh Nimkar</h1>
              <p>atharva123@gmail.com</p>
              <p style="font-size: 13px; margin-top: 8px">
                Member since January 2024
              </p>
              <div class="profile-stats">
                <div class="stat-item">
                  <div class="stat-number">12</div>
                  <div class="stat-label">Videos Uploaded</div>
                </div>
                <div class="stat-item">
                  <div class="stat-number">2.5K</div>
                  <div class="stat-label">Total Views</div>
                </div>
                <div class="stat-item">
                  <div class="stat-number">340</div>
                  <div class="stat-label">Followers</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Profile Form -->
          <form class="profile-form" id="profileForm">
            <!-- Personal Information -->
            <div class="form-section">
              <h3 class="form-title">Personal Information</h3>

              <div class="form-row">
                <div class="form-group">
                  <label for="fullname">Full Name</label>
                  <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    value="Atharva Santosh Nimkar"
                    readonly
                    placeholder="Enter your full name"
                  />
                </div>
                <div class="form-group">
                  <label for="age">Age</label>
                  <input
                    type="number"
                    id="age"
                    name="age"
                    value="20"
                    readonly
                    placeholder="Enter your age"
                  />
                </div>
              </div>

              <div class="form-row full">
                <div class="form-group">
                  <label for="email">Email Address</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    value="atharva123@gmail.com"
                    readonly
                    placeholder="Enter your email"
                  />
                </div>
              </div>
            </div>

            <!-- Academic Information -->
            <div class="form-section">
              <h3 class="form-title">Academic Information</h3>

              <div class="form-row">
                <div class="form-group">
                  <label for="course">Select Course</label>
                  <select id="course" name="course" onchange="redirectToPage()">
                    <option value="">Select a Course</option>
                    <option value="1">AI/ML</option>
                    <option value="2">Web Development</option>
                    <option value="3">Cybersecurity</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="level">Skill Level</label>
                  <select id="level" name="level">
                    <option value="">Select Level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Contact Information -->
            <div class="form-section">
              <h3 class="form-title">Contact Information</h3>

              <div class="form-row">
                <div class="form-group">
                  <label for="phone">Phone Number</label>
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                  />
                </div>
                <div class="form-group">
                  <label for="city">City</label>
                  <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter your city"
                  />
                </div>
              </div>

              <div class="form-row full">
                <div class="form-group">
                  <label for="bio">Bio</label>
                  <textarea
                    id="bio"
                    name="bio"
                    rows="4"
                    placeholder="Tell us about yourself..."
                  ></textarea>
                </div>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="form-actions">
              <button type="submit" class="btn btn-save">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
              </button>
              <button type="reset" class="btn btn-cancel">
                <i class="fa-solid fa-xmark"></i> Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // ========== MENU TOGGLE ==========
      const menuToggle = document.getElementById("menuToggle");
      const sidenav = document.getElementById("sidenav");

      menuToggle.addEventListener("click", function (e) {
        e.stopPropagation();
        sidenav.classList.toggle("mobile-visible");
        menuToggle.classList.toggle("active");
      });

      document.addEventListener("click", function (e) {
        if (!sidenav.contains(e.target) && !menuToggle.contains(e.target)) {
          sidenav.classList.remove("mobile-visible");
          menuToggle.classList.remove("active");
        }
      });

      // Close sidebar on link click (mobile)
      sidenav.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", function () {
          if (window.innerWidth <= 768) {
            sidenav.classList.remove("mobile-visible");
            menuToggle.classList.remove("active");
          }
        });
      });

      // ========== SEARCH SUGGESTIONS ==========
      document
        .getElementById("searchBar")
        .addEventListener("input", function () {
          const query = this.value;
          if (query.length > 1) {
            fetch(`/search-suggestions/?term=${encodeURIComponent(query)}`)
              .then((response) => response.json())
              .then((data) => {
                const suggestionBox = document.getElementById("suggestions");
                suggestionBox.innerHTML = "";
                if (data.length > 0) {
                  data.forEach((title) => {
                    const listItem = document.createElement("li");
                    listItem.textContent = title;
                    listItem.addEventListener("click", () => {
                      document.getElementById("searchBar").value = title;
                      suggestionBox.innerHTML = "";
                    });
                    suggestionBox.appendChild(listItem);
                  });
                }
              })
              .catch((err) => console.error("Search error:", err));
          } else {
            document.getElementById("suggestions").innerHTML = "";
          }
        });

      // Close suggestions when clicking outside
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".search")) {
          document.getElementById("suggestions").innerHTML = "";
        }
      });

      // ========== FORM SUBMISSION ==========
      const profileForm = document.getElementById("profileForm");
      profileForm.addEventListener("submit", function (e) {
        e.preventDefault();

        // Collect form data
        const formData = {
          fullname: document.getElementById("fullname").value,
          email: document.getElementById("email").value,
          age: document.getElementById("age").value,
          course: document.getElementById("course").value,
          level: document.getElementById("level").value,
          phone: document.getElementById("phone").value,
          city: document.getElementById("city").value,
          bio: document.getElementById("bio").value,
        };

        console.log("Form Data:", formData);

        // Show success message
        showSuccessMessage("Profile updated successfully!");
      });

      // ========== SUCCESS MESSAGE ==========
      function showSuccessMessage(message) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "success-message";
        msgDiv.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${message}`;
        document.body.appendChild(msgDiv);

        setTimeout(() => {
          msgDiv.classList.add("hide");
          setTimeout(() => msgDiv.remove(), 300);
        }, 3000);
      }

      // ========== COURSE REDIRECT ==========
      function redirectToPage() {
        const courseSelect = document.getElementById("course");
        const selectedValue = courseSelect.value;

        // Map the selected value to corresponding URLs
        const urls = {
          1: "/aiml",
          2: "/web",
          3: "/cyber",
        };

        // Redirect if a valid option is selected
        if (urls[selectedValue]) {
          window.location.href = urls[selectedValue];
        }
      }

      // ========== SMOOTH SCROLL ==========
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute("href"));
          if (target) {
            target.scrollIntoView({ behavior: "smooth" });
          }
        });
      });
    </script>
  </body>
</html>
