<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Matrix</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #0f0f0f;
        --secondary-color: #1a1a1a;
        --card-bg: #181818;
        --border-color: #272727;
        --hover-bg: #2a2a2a;
        --accent-color: #ff0000;
        --text-primary: #ffffff;
        --text-secondary: #aaaaaa;
        --transition: all 0.3s ease;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #0f0f0f 0%, #141414 100%);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ================= HEADER ================= */

      .header {
        position: sticky;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(10px);
        background: rgba(15, 15, 15, 0.96);
        border-bottom: 1px solid var(--border-color);
      }

      .topnav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 22px;
        height: 70px;
      }

      .menu {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition);
      }

      .menu:hover {
        background: var(--hover-bg);
      }

      .menu i {
        font-size: 20px;
      }

      .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        color: white;
      }

      .logo span {
        color: var(--accent-color);
      }

      /* ================= SEARCH ================= */

      form {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      .search {
        width: 100%;
        max-width: 500px;
        display: flex;
        align-items: center;
        background: var(--secondary-color);
        border: 1px solid var(--border-color);
        border-radius: 40px;
        overflow: hidden;
        transition: var(--transition);
      }

      .search:focus-within {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
      }

      .seainp {
        flex: 1;
        padding: 14px 18px;
        border: none;
        background: transparent;
        color: white;
        font-size: 14px;
        outline: none;
      }

      .seainp::placeholder {
        color: var(--text-secondary);
      }

      .seabtt {
        border: none;
        background: var(--accent-color);
        color: white;
        padding: 12px 22px;
        cursor: pointer;
        font-weight: 600;
        transition: var(--transition);
      }

      .seabtt:hover {
        background: #d60000;
      }

      /* ================= LOGIN ================= */

      .cy ul {
        list-style: none;
      }

      .cy a {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--secondary-color);
        border: 1px solid var(--border-color);
        transition: var(--transition);
        text-decoration: none;
      }

      .cy a:hover {
        background: var(--accent-color);
        transform: scale(1.08);
      }

      .cy i {
        color: white !important;
        font-size: 16px;
        padding: 0 !important;
      }

      /* ================= LAYOUT ================= */

      .main-container {
        display: flex;
        flex: 1;
      }

      /* ================= SIDEBAR ================= */

      .sidenav {
        width: 250px;
        min-height: calc(100vh - 70px);
        background: var(--secondary-color);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px 10px;
      }

      .icon ul,
      .sett ul {
        list-style: none;
      }

      .icon ul {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .icon a {
        text-decoration: none;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 12px;
        transition: var(--transition);
        font-size: 14px;
        font-weight: 500;
      }

      .icon a:hover {
        background: var(--hover-bg);
        color: white;
        transform: translateX(5px);
      }

      .icon a i {
        width: 22px;
        text-align: center;
        font-size: 16px;
      }

      .sett {
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
      }

      .sett ul {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .sett a {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: var(--hover-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: var(--transition);
      }

      .sett a:hover {
        background: var(--accent-color);
        transform: scale(1.08);
      }

      .sett i {
        color: white !important;
      }

      /* ================= MAIN ================= */

      .home {
        flex: 1;
        padding: 35px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 22px;
        align-content: start;
      }

      /* ================= CARD ================= */

      .card {
        background: var(--card-bg);
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        transition: var(--transition);
        cursor: pointer;
      }

      .card:hover {
        transform: translateY(-8px);
        border-color: rgba(255, 0, 0, 0.5);
        box-shadow: 0 16px 30px rgba(255, 0, 0, 0.12);
      }

      .card a {
        text-decoration: none;
        color: inherit;
      }

      .img {
        width: 100%;
        height: 160px;
        overflow: hidden;
        position: relative;
        background: #111;
      }

      .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }

      .card:hover .img img {
        transform: scale(1.08);
      }

      .img::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 0, 0, 0);
        transition: var(--transition);
      }

      .card:hover .img::after {
        background: rgba(255, 0, 0, 0.05);
      }

      .imgmeta {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .title h2 {
        font-size: 15px;
        line-height: 1.5;
        font-weight: 600;
        color: white;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        transition: var(--transition);
      }

      .card:hover .title h2 {
        color: var(--accent-color);
      }

      .date {
        font-size: 12px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .date::before {
        content: "📅";
        font-size: 10px;
      }

      /* ================= SCROLLBAR ================= */

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #2f2f2f;
        border-radius: 20px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #444;
      }

      /* ================= RESPONSIVE ================= */

      @media (max-width: 900px) {
        .sidenav {
          width: 210px;
        }

        .home {
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
      }

      @media (max-width: 768px) {
        .main-container {
          flex-direction: column;
        }

        .sidenav {
          width: 100%;
          min-height: auto;
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }

        .icon ul {
          flex-direction: row;
          flex-wrap: wrap;
        }

        .home {
          padding: 18px;
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap: 14px;
        }

        .topnav {
          gap: 12px;
          padding: 12px;
        }

        .logo {
          display: none;
        }

        .search {
          max-width: 100%;
        }
      }

      @media (max-width: 480px) {
        .home {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 12px;
        }

        .img {
          height: 120px;
        }

        .title h2 {
          font-size: 13px;
        }

        .seabtt {
          padding: 12px 16px;
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <header class="header">
        <div class="topnav">
          <div class="menu">
            <i class="fa-solid fa-bars"></i>
          </div>

          <div class="logo">MAT<span>RIX</span></div>

          <form action="">
            <div class="search">
              <input class="seainp" type="search" placeholder="Search Here" />
              <button class="seabtt" type="submit">Search</button>
            </div>
          </form>

          <div class="cy">
            <ul>
              <li>
                <a href="{% url 'login' %}">
                  <i class="fa-solid fa-right-to-bracket"></i>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </header>

      <div class="main-container">
        <aside class="sidenav">
          <div class="icon">
            <ul>
              <li>
                <a href="/">
                  <i class="fa-solid fa-house"></i>
                  Home
                </a>
              </li>

              <li>
                <a href="/profile">
                  <i class="fa-solid fa-tornado"></i>
                  Profile
                </a>
              </li>

              <li>
                <a href="/upload">
                  <i class="fa-solid fa-upload"></i>
                  Upload
                </a>
              </li>

              <li>
                <a href="/contactus">
                  <i class="fa-solid fa-brain"></i>
                  Chat-Boot
                </a>
              </li>

              <li>
                <a href="/news">
                  <i class="fa-solid fa-newspaper"></i>
                  News
                </a>
              </li>
            </ul>
          </div>

          <div class="sett">
            <ul>
              <li>
                <a href="/info">
                  <i class="fa-regular fa-clock fa-rotate-180"></i>
                </a>
              </li>

              <li>
                <a href="/setting">
                  <i class="fa-solid fa-gear fa-rotate-90"></i>
                </a>
              </li>
            </ul>
          </div>
        </aside>

        <main class="home">
          {% for n in humeData %}
          <div class="card">
            <a href="{% url 'video_detail_cyber' n.id %}">
              <div class="img">
                <img
                  src="{{ n.thumbnail_image.url }}"
                  alt="{{ n.title }} Thumbnail"
                />
              </div>

              <div class="imgmeta">
                <div class="title">
                  <h2>{{ n.title }}</h2>
                </div>

                <div class="date">{{ n.dinak }}</div>
              </div>
            </a>
          </div>
          {% endfor %}
        </main>
      </div>
    </div>
  </body>
</html>
