<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/static/img/dot_matrix.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Upload Video - Matrix</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #0f0f0f;
        --secondary-color: #212121;
        --accent-color: #ff0000;
        --text-primary: #ffffff;
        --text-secondary: #a8a8a8;
        --border-color: #272727;
        --hover-bg: #272727;
        --card-bg: #1a1a1a;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .main-container {
        display: flex;
        flex: 1;
      }

      /* ========== HEADER ========== */
      .header {
        background: var(--primary-color);
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(10px);
        background: rgba(15, 15, 15, 0.95);
      }

      .topnav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        gap: 30px;
        height: 65px;
      }

      .menu {
        display: none;
        font-size: 24px;
        cursor: pointer;
        transition: var(--transition);
        padding: 10px;
        border-radius: 8px;
      }

      .menu:hover {
        background: var(--hover-bg);
      }

      .menu.active {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ========== SEARCH BAR ========== */
      .search {
        display: flex;
        align-items: center;
        background: var(--secondary-color);
        border: 1px solid var(--border-color);
        border-radius: 25px;
        padding: 8px 15px;
        gap: 12px;
        flex: 0 1 400px;
        position: relative;
        transition: var(--transition);
      }

      .search:focus-within {
        background: var(--secondary-color);
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
      }

      .seainp {
        background: transparent;
        border: none;
        color: var(--text-primary);
        flex: 1;
        padding: 8px 0;
        font-size: 14px;
        outline: none;
      }

      .seainp::placeholder {
        color: var(--text-secondary);
      }

      .seabtt {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: var(--transition);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .seabtt:hover {
        background: #cc0000;
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(255, 0, 0, 0.3);
      }

      /* ========== SUGGESTIONS DROPDOWN ========== */
      .suggestion-list {
        list-style: none;
        padding: 8px 0;
        margin: 0;
        border: 1px solid var(--border-color);
        position: absolute;
        background: var(--secondary-color);
        z-index: 1001;
        top: 100%;
        left: 0;
        right: 0;
        margin-top: 8px;
        border-radius: 12px;
        max-height: 400px;
        overflow-y: auto;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }

      .suggestion-list li {
        padding: 12px 16px;
        cursor: pointer;
        font-size: 13px;
        transition: var(--transition);
        border-left: 3px solid transparent;
      }

      .suggestion-list li:hover {
        background-color: var(--hover-bg);
        border-left-color: var(--accent-color);
        padding-left: 16px;
      }

      /* ========== LOGIN BUTTON ========== */
      .cy {
        display: flex;
        align-items: center;
      }

      .cy ul {
        list-style-type: none;
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .cy a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: var(--secondary-color);
        border-radius: 50%;
        transition: var(--transition);
        font-size: 18px;
        color: var(--accent-color);
        border: 1px solid var(--border-color);
      }

      .cy a:hover {
        background: var(--accent-color);
        color: white;
        transform: scale(1.1);
      }

      /* ========== SIDEBAR ========== */
      .sidenav {
        display: flex;
        flex-direction: column;
        width: 260px;
        background: var(--secondary-color);
        border-right: 1px solid var(--border-color);
        padding: 20px 0;
        overflow-y: auto;
        height: auto;
      }

      .sidenav .icon {
        flex: 1;
        padding: 0 10px;
      }

      .sidenav .icon ul {
        list-style-type: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sidenav .icon a {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 12px 16px;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 8px;
        transition: var(--transition);
        font-size: 14px;
        font-weight: 500;
      }

      .sidenav .icon a:hover {
        background: var(--hover-bg);
        color: var(--text-primary);
        padding-left: 20px;
      }

      .sidenav .icon a i {
        font-size: 18px;
        width: 24px;
      }

      .sidenav .sett {
        padding: 20px 10px;
        border-top: 1px solid var(--border-color);
        margin-top: auto;
      }

      .sidenav .sett ul {
        list-style-type: none;
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .sidenav .sett a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: var(--hover-bg);
        border-radius: 8px;
        color: var(--text-secondary);
        text-decoration: none;
        transition: var(--transition);
        font-size: 16px;
      }

      .sidenav .sett a:hover {
        background: var(--accent-color);
        color: white;
        transform: scale(1.1);
      }

      /* ========== MOBILE SIDEBAR OVERLAY ========== */
      .sidenav.mobile-visible {
        position: fixed;
        left: 0;
        top: 65px;
        width: 240px;
        height: calc(100vh - 65px);
        z-index: 999;
        animation: slideInLeft 0.3s ease-out;
      }

      @keyframes slideInLeft {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(0);
        }
      }

      /* ========== UPLOAD CONTAINER ========== */
      .upload-container {
        flex: 1;
        padding: 40px;
        width: 100%;
        overflow-y: auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .upload-wrapper {
        width: 100%;
        max-width: 700px;
      }

      .upload-header {
        margin-bottom: 40px;
        text-align: center;
      }

      .upload-header h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          var(--accent-color) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .upload-header p {
        font-size: 14px;
        color: var(--text-secondary);
      }

      /* ========== UPLOAD FORM ========== */
      .upload-form {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 40px;
        animation: fadeIn 0.6s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-group {
        margin-bottom: 28px;
      }

      .form-group:last-child {
        margin-bottom: 0;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-group input[type="text"],
      .form-group input[type="date"],
      .form-group textarea {
        width: 100%;
        background: var(--secondary-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 14px 16px;
        color: var(--text-primary);
        font-size: 14px;
        font-family: "Inter", sans-serif;
        transition: var(--transition);
        outline: none;
        resize: vertical;
      }

      .form-group input[type="text"]::placeholder,
      .form-group textarea::placeholder {
        color: var(--text-secondary);
      }

      .form-group input[type="text"]:focus,
      .form-group input[type="date"]:focus,
      .form-group textarea:focus {
        border-color: var(--accent-color);
        background: var(--secondary-color);
        box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
      }

      .form-group textarea {
        min-height: 120px;
        resize: vertical;
      }

      /* ========== FILE UPLOAD ========== */
      .file-upload-group {
        margin-bottom: 28px;
      }

      .file-upload-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .file-input-wrapper {
        position: relative;
        display: block;
      }

      .file-input-label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 30px;
        background: var(--secondary-color);
        border: 2px dashed var(--border-color);
        border-radius: 8px;
        cursor: pointer;
        transition: var(--transition);
        text-align: center;
      }

      .file-input-label:hover {
        border-color: var(--accent-color);
        background: rgba(255, 0, 0, 0.05);
      }

      .file-input-label i {
        font-size: 24px;
        color: var(--accent-color);
      }

      .file-input-label span {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .file-input-label .file-name {
        font-size: 13px;
        color: var(--text-primary);
        font-weight: 500;
      }

      .file-input-label .file-hint {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .form-group input[type="file"] {
        display: none;
      }

      .file-selected {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: rgba(0, 255, 0, 0.1);
        border: 1px solid rgba(0, 255, 0, 0.3);
        border-radius: 8px;
        color: #00ff00;
        font-size: 13px;
        margin-top: 8px;
      }

      .file-selected i {
        font-size: 16px;
      }

      /* ========== SUBMIT BUTTON ========== */
      .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid var(--border-color);
      }

      .btn {
        flex: 1;
        padding: 14px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-upload {
        background: linear-gradient(
          135deg,
          var(--accent-color) 0%,
          #ff3333 100%
        );
        color: white;
      }

      .btn-upload:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(255, 0, 0, 0.3);
      }

      .btn-upload:active {
        transform: translateY(0);
      }

      .btn-upload:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .btn-reset {
        background: var(--secondary-color);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }

      .btn-reset:hover {
        background: var(--hover-bg);
        border-color: var(--accent-color);
      }

      /* ========== PROGRESS INDICATOR ========== */
      .upload-progress {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: var(--secondary-color);
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      .upload-progress.show {
        display: block;
        animation: fadeIn 0.3s ease-in-out;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: var(--border-color);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--accent-color) 0%,
          #ff3333 100%
        );
        width: 0%;
        transition: width 0.3s ease-in-out;
      }

      .progress-text {
        font-size: 12px;
        color: var(--text-secondary);
        text-align: center;
      }

      /* ========== NOTIFICATIONS ========== */
      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 16px 24px;
        border-radius: 8px;
        font-weight: 600;
        z-index: 10000;
        animation: slideInRight 0.3s ease-out;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .notification.success {
        background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
        color: #000;
        box-shadow: 0 8px 16px rgba(0, 255, 0, 0.3);
      }

      .notification.error {
        background: linear-gradient(
          135deg,
          var(--accent-color) 0%,
          #ff3333 100%
        );
        color: white;
        box-shadow: 0 8px 16px rgba(255, 0, 0, 0.3);
      }

      @keyframes slideInRight {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .notification.hide {
        animation: slideOutRight 0.3s ease-out forwards;
      }

      @keyframes slideOutRight {
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }

      /* ========== RESPONSIVE ========== */
      @media (max-width: 768px) {
        .topnav {
          padding: 12px 12px;
          gap: 12px;
        }

        .menu {
          display: flex !important;
          align-items: center;
          justify-content: center;
        }

        .search {
          flex: 1;
          min-width: 0;
        }

        .sidenav {
          display: none;
        }

        .sidenav.mobile-visible {
          display: flex;
        }

        .upload-container {
          padding: 20px;
        }

        .upload-form {
          padding: 25px;
        }

        .upload-header h1 {
          font-size: 24px;
        }

        .form-actions {
          flex-direction: column;
          gap: 10px;
        }

        .btn {
          padding: 12px 16px;
          font-size: 13px;
        }
      }

      @media (max-width: 480px) {
        .upload-container {
          padding: 15px;
        }

        .upload-form {
          padding: 20px;
        }

        .upload-header h1 {
          font-size: 20px;
        }

        .file-input-label {
          padding: 20px;
        }

        .file-input-label i {
          font-size: 20px;
        }

        .file-input-label .file-name {
          font-size: 12px;
        }
      }

      /* ========== SCROLLBAR ========== */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header class="header">
        <div class="topnav">
          <div class="menu" id="menuToggle">
            <i class="fa-solid fa-bars" style="color: #ffffff"></i>
          </div>
          <form method="get" action="">
            <div class="search">
              <i
                class="fa-solid fa-magnifying-glass"
                style="color: var(--text-secondary); font-size: 14px"
              ></i>
              <input
                class="seainp"
                id="searchBar"
                name="search"
                type="search"
                placeholder="Search videos..."
              />
              <ul id="suggestions" class="suggestion-list"></ul>
              <button class="seabtt" type="submit">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </form>
          <div class="cy">
            <ul>
              <li>
                <a href="{% url 'login' %}" title="Sign In">
                  <i class="fa-solid fa-user"></i>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </header>

      <div class="main-container">
        <aside class="sidenav" id="sidenav">
          <div class="icon">
            <ul>
              <li>
                <a href="/">
                  <i class="fa-solid fa-house"></i>
                  <span>Home</span>
                </a>
              </li>
              <li>
                <a href="/profile">
                  <i class="fa-solid fa-user-circle"></i>
                  <span>Profile</span>
                </a>
              </li>
              <li>
                <a href="/upload">
                  <i class="fa-solid fa-cloud-arrow-up"></i>
                  <span>Upload</span>
                </a>
              </li>
              <li>
                <a href="/contactus">
                  <i class="fa-solid fa-comments"></i>
                  <span>Chat-Bot</span>
                </a>
              </li>
              <li>
                <a href="/news">
                  <i class="fa-solid fa-newspaper"></i>
                  <span>News</span>
                </a>
              </li>
            </ul>
          </div>
          <div class="sett">
            <ul>
              <li>
                <a href="/info" title="Info">
                  <i class="fa-solid fa-circle-info"></i>
                </a>
              </li>
              <li>
                <a href="/setting" title="Settings">
                  <i class="fa-solid fa-gear"></i>
                </a>
              </li>
            </ul>
          </div>
        </aside>

        <div class="upload-container">
          <div class="upload-wrapper">
            <div class="upload-header">
              <h1>
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Your Video
              </h1>
              <p>
                Share your knowledge with the world. Upload high-quality videos
                and reach thousands of learners.
              </p>
            </div>

            <form
              class="upload-form"
              method="post"
              action="{% url 'saveenquiry' %}"
              enctype="multipart/form-data"
              id="uploadForm"
            >
              {% csrf_token %}

              <!-- Title -->
              <div class="form-group">
                <label for="title">Video Title *</label>
                <input
                  type="text"
                  id="title"
                  name="title"
                  placeholder="Enter an engaging title for your video..."
                  required
                />
              </div>

              <!-- Description -->
              <div class="form-group">
                <label for="description">Description *</label>
                <textarea
                  id="description"
                  name="description"
                  placeholder="Write a detailed description of your video. Include key topics, learning outcomes, and any relevant information..."
                  required
                ></textarea>
              </div>

              <!-- Date -->
              <div class="form-group">
                <label for="date">Upload Date</label>
                <input type="date" id="date" name="date" />
              </div>

              <!-- Thumbnail -->
              <div class="file-upload-group">
                <label for="thumbnail">Thumbnail Image *</label>
                <div class="file-input-wrapper">
                  <label for="thumbnail" class="file-input-label">
                    <span>
                      <i class="fa-solid fa-image"></i>
                      <span class="file-name">Choose thumbnail image</span>
                      <span class="file-hint">PNG, JPG up to 10MB</span>
                    </span>
                  </label>
                  <input
                    type="file"
                    id="thumbnail"
                    name="thumbnail"
                    accept="image/*"
                    required
                  />
                  <div
                    id="thumbnailSelected"
                    class="file-selected"
                    style="display: none"
                  >
                    <i class="fa-solid fa-check-circle"></i>
                    <span id="thumbnailName"></span>
                  </div>
                </div>
              </div>

              <!-- Video -->
              <div class="file-upload-group">
                <label for="video">Video File *</label>
                <div class="file-input-wrapper">
                  <label for="video" class="file-input-label">
                    <span>
                      <i class="fa-solid fa-video"></i>
                      <span class="file-name">Choose video file</span>
                      <span class="file-hint">MP4, WebM up to 500MB</span>
                    </span>
                  </label>
                  <input
                    type="file"
                    id="video"
                    name="video"
                    accept="video/*"
                    required
                  />
                  <div
                    id="videoSelected"
                    class="file-selected"
                    style="display: none"
                  >
                    <i class="fa-solid fa-check-circle"></i>
                    <span id="videoName"></span>
                  </div>
                </div>
              </div>

              <!-- Upload Progress -->
              <div class="upload-progress" id="uploadProgress">
                <div class="progress-bar">
                  <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                  <span id="progressText">0%</span>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="form-actions">
                <button type="submit" class="btn btn-upload" id="uploadBtn">
                  <i class="fa-solid fa-cloud-arrow-up"></i> Upload Video
                </button>
                <button type="reset" class="btn btn-reset" id="resetBtn">
                  <i class="fa-solid fa-xmark"></i> Clear
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ========== MENU TOGGLE ==========
      const menuToggle = document.getElementById("menuToggle");
      const sidenav = document.getElementById("sidenav");

      menuToggle.addEventListener("click", function (e) {
        e.stopPropagation();
        sidenav.classList.toggle("mobile-visible");
        menuToggle.classList.toggle("active");
      });

      document.addEventListener("click", function (e) {
        if (!sidenav.contains(e.target) && !menuToggle.contains(e.target)) {
          sidenav.classList.remove("mobile-visible");
          menuToggle.classList.remove("active");
        }
      });

      // Close sidebar on link click (mobile)
      sidenav.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", function () {
          if (window.innerWidth <= 768) {
            sidenav.classList.remove("mobile-visible");
            menuToggle.classList.remove("active");
          }
        });
      });

      // ========== SEARCH SUGGESTIONS ==========
      document
        .getElementById("searchBar")
        .addEventListener("input", function () {
          const query = this.value;
          if (query.length > 1) {
            fetch(`/search-suggestions/?term=${encodeURIComponent(query)}`)
              .then((response) => response.json())
              .then((data) => {
                const suggestionBox = document.getElementById("suggestions");
                suggestionBox.innerHTML = "";
                if (data.length > 0) {
                  data.forEach((title) => {
                    const listItem = document.createElement("li");
                    listItem.textContent = title;
                    listItem.addEventListener("click", () => {
                      document.getElementById("searchBar").value = title;
                      suggestionBox.innerHTML = "";
                    });
                    suggestionBox.appendChild(listItem);
                  });
                }
              })
              .catch((err) => console.error("Search error:", err));
          } else {
            document.getElementById("suggestions").innerHTML = "";
          }
        });

      // Close suggestions when clicking outside
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".search")) {
          document.getElementById("suggestions").innerHTML = "";
        }
      });

      // ========== FILE UPLOAD HANDLERS ==========
      const thumbnailInput = document.getElementById("thumbnail");
      const videoInput = document.getElementById("video");
      const uploadForm = document.getElementById("uploadForm");
      const uploadBtn = document.getElementById("uploadBtn");

      // Thumbnail file selection
      thumbnailInput.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
          const thumbnailSelected =
            document.getElementById("thumbnailSelected");
          const thumbnailName = document.getElementById("thumbnailName");
          thumbnailName.textContent =
            file.name + " (" + formatFileSize(file.size) + ")";
          thumbnailSelected.style.display = "flex";
        }
      });

      // Video file selection
      videoInput.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
          const videoSelected = document.getElementById("videoSelected");
          const videoName = document.getElementById("videoName");
          videoName.textContent =
            file.name + " (" + formatFileSize(file.size) + ")";
          videoSelected.style.display = "flex";
        }
      });

      // Format file size
      function formatFileSize(bytes) {
        if (bytes === 0) return "0 Bytes";
        const k = 1024;
        const sizes = ["Bytes", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (
          Math.round((bytes / Math.pow(k, i)) * 100) / 100 + " " + sizes[i]
        );
      }

      // ========== FORM SUBMISSION ==========
      uploadForm.addEventListener("submit", function (e) {
        e.preventDefault();

        // Validate form
        if (!uploadForm.checkValidity()) {
          showNotification("Please fill in all required fields", "error");
          return;
        }

        // Show progress
        const uploadProgress = document.getElementById("uploadProgress");
        uploadProgress.classList.add("show");
        uploadBtn.disabled = true;

        // Simulate progress (optional - remove if you want real progress)
        let progress = 0;
        const progressInterval = setInterval(() => {
          if (progress < 90) {
            progress += Math.random() * 30;
            updateProgress(progress);
          }
        }, 200);

        // Submit form
        const formData = new FormData(uploadForm);

        fetch(uploadForm.action, {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            clearInterval(progressInterval);
            updateProgress(100);

            setTimeout(() => {
              showNotification("Video uploaded successfully!", "success");
              uploadForm.reset();
              uploadProgress.classList.remove("show");
              uploadBtn.disabled = false;
              document.getElementById("thumbnailSelected").style.display =
                "none";
              document.getElementById("videoSelected").style.display = "none";
            }, 500);
          })
          .catch((error) => {
            clearInterval(progressInterval);
            uploadProgress.classList.remove("show");
            uploadBtn.disabled = false;
            showNotification(
              "Error uploading video. Please try again.",
              "error",
            );
            console.error("Error:", error);
          });
      });

      function updateProgress(percent) {
        const progressFill = document.getElementById("progressFill");
        const progressText = document.getElementById("progressText");
        progressFill.style.width = percent + "%";
        progressText.textContent = Math.round(percent) + "%";
      }

      // ========== NOTIFICATIONS ==========
      function showNotification(message, type) {
        const notification = document.createElement("div");
        notification.className = `notification ${type}`;
        notification.innerHTML = `
                <i class="fa-solid fa-${type === "success" ? "check-circle" : "exclamation-circle"}"></i>
                <span>${message}</span>
            `;
        document.body.appendChild(notification);

        setTimeout(() => {
          notification.classList.add("hide");
          setTimeout(() => notification.remove(), 300);
        }, 3000);
      }

      // ========== AUTO-FILL TODAY'S DATE ==========
      document.addEventListener("DOMContentLoaded", () => {
        const dateField = document.getElementById("date");
        const today = new Date().toISOString().split("T")[0];
        dateField.value = today;
      });

      // ========== SMOOTH SCROLL ==========
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute("href"));
          if (target) {
            target.scrollIntoView({ behavior: "smooth" });
          }
        });
      });
    </script>
  </body>
</html>
